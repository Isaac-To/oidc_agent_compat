# Central proxy config for Docker dev stack.
# Providers and encrypted provider keys are managed through the admin API.

listen_addr = "0.0.0.0:8443"
database_url = "sqlite:///data/central.db"
dev_mode = true

[oidc]
issuer = "http://keycloak:8080/realms/oac-dev"
# Central does NOT log in/validate tokens itself — identity comes from the
# relay over mTLS. client_id is not used at runtime; oac-relay is the RP.
client_id = "oac-central"
client_secret_env = "OAC_OIDC_CLIENT_SECRET"
redirect_uri = "http://127.0.0.1:0/callback"
scopes = ["openid"]

[mtls]
ca_cert_path = "/certs/ca.crt"
server_cert_path = "/certs/server.crt"
server_key_path = "/certs/server.key"

# Admin API (group-based auth via the IdP through the relay).
# Users in the "oac-admins" group can call the admin API.
[admin]
admin_group = "oac-admins"
