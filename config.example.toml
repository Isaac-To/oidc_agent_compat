# OIDC Agent Compatibility Server — Example Configuration
#
# The relay and central proxy each use a SEPARATE config file with flat
# top-level fields (NOT under a [relay] or [central] section). Copy the
# relevant block below into its own file (e.g. relay.toml / central.toml)
# and edit for your environment. NEVER commit a filled config — it is
# gitignored.
#
# See docs/src/user-guide/configuration.md for the full field reference.

# ─── Relay configuration (laptop) ───────────────────────────────────────────
# Save as relay.toml. The relay listens on loopback only. The agent
# (Codex, etc.) points at this address. 127.0.0.1 is required; 0.0.0.0 is
# rejected unless dev_mode = true.
#
# listen_addr = "127.0.0.1:8787"
# database_url = "sqlite://~/.oac/relay.db"
# dev_mode = false
# Token lifetime is set via the --ttl flag on `oac-relay login`
# (e.g. --ttl 1d, --ttl 1y). Default: never expires.
#
# [oidc]
# issuer = "https://idp.example.com"
# client_id = "oac-relay"
# # The env var holding the OIDC client secret (never a literal here):
# client_secret_env = "OAC_OIDC_CLIENT_SECRET"
# redirect_uri = "http://127.0.0.1:0/callback"
# # The "groups" scope is REQUIRED for group-based policy enforcement and
# # admin authorization. Without it central cannot enforce group policies.
# scopes = ["openid", "email", "profile", "groups"]
#
# [central]
# url = "https://central.example.com"
# NOTE: cert paths are raw filesystem reads — "~" is NOT expanded. Use
# absolute paths (only sqlite:// database URLs expand "~").
# ca_cert_path = "/etc/oac/ca.pem"
# client_cert_path = "/home/yourname/.oac/client.pem"
# client_key_path = "/home/yourname/.oac/client.key"

# ─── Central proxy configuration (company-hosted) ───────────────────────────
# Save as central.toml. Providers and their API keys are managed at runtime
# through the admin API and are not stored in this config file.
#
# listen_addr = "0.0.0.0:8443"
# database_url = "postgres://central.example.com/oac"
# # When true, serves plain HTTP, allows requests without relay-forwarded
# # identity headers, and disables the rate limiter entirely (for
# # dev/testing only). Defaults to false.
# dev_mode = false
# # Production per-client-IP token bucket. Defaults to 60 requests per 60s.
# rate_limit_requests = 60
# rate_limit_window_secs = 60
#
# [oidc]
# issuer = "https://idp.example.com"
# # The central proxy does NOT perform its own OIDC login or token validation —
# # it trusts identity forwarded by the relay over mTLS. This client_id is not
# # used at runtime; oac-relay is the OIDC relying party.
# client_id = "oac-central"
# client_secret_env = "OAC_OIDC_CLIENT_SECRET"
# redirect_uri = "http://127.0.0.1:0/callback"
# scopes = ["openid"]
#
# [mtls]
# ca_cert_path = "/etc/oac/ca.pem"
# server_cert_path = "/etc/oac/server.pem"
# server_key_path = "/etc/oac/server.key"
#
# # Admin API (optional). If present, enables the /admin/v1/ endpoints for
# # managing group policies, devices, and querying audit logs. Access is
# # authorized by IdP group membership — users in the configured admin_group
# # (authenticated via the relay's OIDC login flow) may call the admin API.
# # No static admin token is used; the admin's OIDC identity is the auth.
# # Requires the relay to request the "groups" scope (see relay [oidc] above).
# [admin]
# admin_group = "oac-admins"
#
# # Optional per-model pricing for cost tracking in usage/audit reports.
# # If the [pricing] section is omitted entirely, costs are NOT tracked
# # (cost_usd = 0.0). When present, manual entries below override
# # auto-fetched prices; prices are auto-fetched from the backend
# # /v1/models at startup (best-effort) and every fetch_interval_secs
# # (default 3600; set 0 to disable auto-fetch).
# [pricing]
# # fetch_interval_secs = 3600
# # [[pricing.models]]
# # model = "gpt-4o"
# # input_per_1k_usd = 0.005
# # output_per_1k_usd = 0.015
